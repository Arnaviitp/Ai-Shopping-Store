<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumosis × Aivora — Mood-Aware AI Shopping</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      font-size: 2.3rem;
      font-weight: 700;
      text-shadow: 0 0 20px cyan;
      letter-spacing: 1px;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }

    select, button {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      outline: none;
    }

    select {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid cyan;
      width: 100%;
      max-width: 300px;
    }

    button {
      background: linear-gradient(90deg, #00b4db, #0083b0);
      color: #fff;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      box-shadow: 0 0 15px cyan;
      transform: scale(1.05);
    }

    .suggestions {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px cyan;
    }

    .card h4 { color: #00eaff; }
    .card p { font-size: 0.9rem; color: #ccc; }
    .card button {
      margin-top: 8px;
      width: 100%;
    }

    .chatbot {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      border: 1px solid cyan;
    }

    .chat-display {
      height: 200px;
      overflow-y: auto;
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }

    .chat-msg { margin: 8px 0; }
    .chat-msg.user { text-align: right; color: #00e0ff; }
    .chat-msg.bot { text-align: left; color: #fff; }

    .input-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
      min-width: 200px;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      header { font-size: 1.8rem; }
      section { padding: 20px; }
      .chat-display { height: 180px; }
    }
  </style>
</head>
<body>
  <header>🌌 Lumosis × Aivora</header>

  <section>
    <h2>✨ How are you feeling today?</h2>
    <select id="mood">
      <option value="">Select your mood</option>
      <option value="tired">😴 Tired</option>
      <option value="stressed">😖 Stressed</option>
      <option value="happy">😊 Happy</option>
      <option value="sad">😔 Sad</option>
      <option value="energetic">⚡ Energetic</option>
    </select>
    <button onclick="fetchAIProducts()">Get AI Suggestions</button>
    <p id="moodInfo" style="margin-top:10px; color:#00eaff; display:none;"></p>

    <div class="suggestions" id="suggestions"></div>

    <div class="chatbot">
      <h3>💬 Aivora — Your Smart Shopping Assistant</h3>
      <div class="chat-display" id="chatDisplay"></div>
      <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ask Aivora for comparisons..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div id="emiSection" style="display:none; margin-top:25px;">
      <h3>💳 Smart EMI Plan</h3>
      <p id="emiResult">Calculating best payment options...</p>
    </div>
  </section>

  <footer>© 2025 Lumosis × Aivora — AI Mood Experience</footer>

  <script>
    async function fetchAIProducts() {
      const mood = document.getElementById('mood').value;
      const info = document.getElementById('moodInfo');
      const suggestions = document.getElementById('suggestions');
      if (!mood) return alert("Please select your mood first!");

      info.style.display = "block";
      info.textContent = `Aivora is curating products for your ${mood} mood...`;
      suggestions.innerHTML = "";

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: "You are Lumosis, an AI mood stylist that generates curated calming teas, gentle skincare, and comfy outfits based on mood. Return JSON with name, type, and price in rupees for 50+ unique products." },
              { role: "user", content: `Generate 50+ futuristic product recommendations for someone who feels ${mood}.` }
            ],
            max_tokens: 1000
          })
        });

        const data = await res.json();
        let text = data.choices?.[0]?.message?.content;
        let jsonStart = text.indexOf('[');
        let jsonEnd = text.lastIndexOf(']');
        let jsonStr = text.slice(jsonStart, jsonEnd + 1);

        const products = JSON.parse(jsonStr);
        info.textContent = `Showing AI-suggested picks for your ${mood} mood:`;

        products.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h4>${item.name}</h4>
            <p>${item.type}</p>
            <p>${item.price}</p>
            <button onclick="buyProduct('${item.name}', '${item.price}')">Buy Instantly</button>
          `;
          suggestions.appendChild(card);
        });

      } catch (err) {
        info.textContent = "⚠️ Failed to fetch AI products. Check connection or API key.";
        console.error(err);
      }
    }

    function buyProduct(name, price) {
      const emi = document.getElementById('emiSection');
      const emiRes = document.getElementById('emiResult');
      emi.style.display = 'block';
      emiRes.textContent = `Checking EMI options for ${name} (${price})...`;
      setTimeout(() => {
        const val = parseInt(price.replace('₹','')) || 1200;
        emiRes.innerHTML = `
          ✅ EMI Plan: 3 months × ₹${(val/3).toFixed(0)}  
          <br>💡 Tip: Use Lumosis SmartPay for 10% cashback!
        `;
      }, 1500);
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const display = document.getElementById('chatDisplay');
      const msg = input.value.trim();
      if (!msg) return;

      display.innerHTML += `<div class='chat-msg user'>${msg}</div>`;
      input.value = "";
      const botDiv = document.createElement('div');
      botDiv.className = 'chat-msg bot';
      botDiv.textContent = "Aivora is thinking...";
      display.appendChild(botDiv);
      display.scrollTop = display.scrollHeight;

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: "You are Aivora, an AI shopping assistant that compares and ranks products based on customer sentiment, value, and popularity." },
              { role: "user", content: msg }
            ],
            max_tokens: 200
          })
        });

        const data = await res.json();
        botDiv.textContent = data.choices?.[0]?.message?.content || "Sorry, I couldn’t process that.";
      } catch (err) {
        botDiv.textContent = "⚠️ Network error or invalid API key.";
      }
    }
  </script>
</body>
</html>
