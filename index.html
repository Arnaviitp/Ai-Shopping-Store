<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumosis × Aivora — Mood-Aware AI Shopping</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      font-size: 2.5rem;
      font-weight: 700;
      text-shadow: 0 0 20px cyan;
      letter-spacing: 1.5px;
    }

    section {
      max-width: 900px;
      margin: auto;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
      backdrop-filter: blur(8px);
      transition: 0.3s;
    }

    select, button {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      outline: none;
    }

    select {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid cyan;
    }

    button {
      background: linear-gradient(90deg, #00b4db, #0083b0);
      color: #fff;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      box-shadow: 0 0 15px cyan;
      transform: scale(1.05);
    }

    .suggestions {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(0,255,255,0.3);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px cyan;
    }

    .chatbot {
      margin-top: 30px;
      padding: 20px;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      border: 1px solid cyan;
    }

    .chat-display {
      height: 180px;
      overflow-y: auto;
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }

    .chat-msg {
      margin: 8px 0;
    }

    .chat-msg.user {
      text-align: right;
      color: #00e0ff;
    }

    .chat-msg.bot {
      text-align: left;
      color: #fff;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>🌌 Lumosis × Aivora</header>

  <section>
    <h2>✨ How are you feeling today?</h2>
    <select id="mood">
      <option value="">Select your mood</option>
      <option value="tired">😴 Tired</option>
      <option value="stressed">😖 Stressed</option>
      <option value="happy">😊 Happy</option>
      <option value="sad">😔 Sad</option>
      <option value="energetic">⚡ Energetic</option>
    </select>
    <button onclick="showSuggestions()">Explore Products</button>

    <div class="suggestions" id="suggestions"></div>

    <div class="chatbot">
      <h3>💬 Aivora — Your Smart Shopping Assistant</h3>
      <div class="chat-display" id="chatDisplay"></div>
      <div class="input-area">
        <input type="text" id="chatInput" placeholder="Ask Aivora for comparisons..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div id="emiSection" style="display:none; margin-top:20px;">
      <h3>💳 Smart EMI Plan</h3>
      <p id="emiResult">Calculating best payment options...</p>
    </div>
  </section>

  <footer>© 2025 Lumosis × Aivora — AI Mood Experience</footer>

  <script>
    const suggestionsData = {
      tired: [
        { name: "Chamomile Calm Tea", type: "Tea", price: "₹499" },
        { name: "Aloe Sleep Serum", type: "Skincare", price: "₹899" },
        { name: "Cloud Cotton Hoodie", type: "Outfit", price: "₹1499" }
      ],
      stressed: [
        { name: "Lavender Zen Tea", type: "Tea", price: "₹599" },
        { name: "Soothing Clay Mask", type: "Skincare", price: "₹799" },
        { name: "Soft Linen Loungewear", type: "Outfit", price: "₹1399" }
      ],
      happy: [
        { name: "Lemon Vital Tea", type: "Tea", price: "₹399" },
        { name: "Glow Radiance Cream", type: "Skincare", price: "₹999" },
        { name: "Sunny Day Dress", type: "Outfit", price: "₹1599" }
      ],
      sad: [
        { name: "Peppermint Refresh Tea", type: "Tea", price: "₹549" },
        { name: "Hydrating Gel Balm", type: "Skincare", price: "₹899" },
        { name: "Comfort Knit Sweater", type: "Outfit", price: "₹1499" }
      ],
      energetic: [
        { name: "Green Power Tea", type: "Tea", price: "₹499" },
        { name: "Citrus Energy Mist", type: "Skincare", price: "₹799" },
        { name: "Active Fit Joggers", type: "Outfit", price: "₹1299" }
      ]
    };

    function showSuggestions() {
      const mood = document.getElementById('mood').value;
      const container = document.getElementById('suggestions');
      container.innerHTML = "";
      if (!mood) return alert("Please select your mood first!");

      suggestionsData[mood].forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h4>${item.name}</h4>
          <p>${item.type}</p>
          <p>${item.price}</p>
          <button onclick="buyProduct('${item.name}', '${item.price}')">Buy Now</button>
        `;
        container.appendChild(card);
      });
    }

    function buyProduct(name, price) {
      document.getElementById('emiSection').style.display = 'block';
      document.getElementById('emiResult').textContent = `Checking EMI options for ${name} (${price})...`;

      setTimeout(() => {
        document.getElementById('emiResult').innerHTML = `
          ✅ EMI Plan: 3 months × ${(parseInt(price.replace('₹', ''))/3).toFixed(0)}  
          <br>💡 Smart Suggestion: Use Lumosis Pay for extra 10% cashback!
        `;
      }, 2000);
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const display = document.getElementById('chatDisplay');
      const userMsg = input.value.trim();
      if (!userMsg) return;

      display.innerHTML += `<div class='chat-msg user'>${userMsg}</div>`;
      input.value = "";

      const botDiv = document.createElement('div');
      botDiv.className = 'chat-msg bot';
      botDiv.textContent = "Aivora is thinking...";
      display.appendChild(botDiv);
      display.scrollTop = display.scrollHeight;

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: "You are Aivora, an AI shopping assistant that compares products and ranks them by customer sentiment and value." },
              { role: "user", content: userMsg }
            ],
            max_tokens: 150
          })
        });

        const data = await res.json();
        const botReply = data.choices?.[0]?.message?.content || "Sorry, I couldn’t process that.";
        botDiv.textContent = botReply;
      } catch (err) {
        botDiv.textContent = "⚠️ Network error or invalid API key.";
      }
    }
  </script>
</body>
</html>
